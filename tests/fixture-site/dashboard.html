<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>演练靶场 · 工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="nav">
  <button class="tab active" data-tab="overview">总览</button>
  <button class="tab" data-tab="tasks">任务</button>
  <button class="tab" data-tab="reports">报表</button>
</div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><b data-stat="visitors">…</b><span>今日访客</span></div>
    <div class="stat"><b data-stat="tasks">…</b><span>进行中任务</span></div>
    <div class="stat"><b data-stat="health">…</b><span>健康分</span></div>
  </div>
  <div class="pane" id="pane-overview">
    <h3 style="margin-top:0">总览</h3>
    <p>当前基线数据由接口渲染。</p>
    <button class="btn" id="openModal">打开详情弹窗</button>
  </div>
  <div class="pane" id="pane-tasks" hidden><h3 style="margin-top:0">任务</h3><p>任务列表示意（演练靶场）。</p></div>
  <div class="pane" id="pane-reports" hidden><h3 style="margin-top:0">报表</h3><p>报表示意（演练靶场）。</p></div>
</div>
<div class="modal" id="modal" hidden>
  <div class="box">
    <h3 style="margin-top:0">详情弹窗</h3>
    <p id="modalBody">这是演练靶场的详情弹窗内容。</p>
    <button class="btn" id="closeModal">关 闭</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
